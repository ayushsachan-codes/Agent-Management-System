<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Directory - AgentPro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark.css">
</head>
<body>
  <div class="app-container">
    <aside id="app-sidebar"></aside>

    <main class="app-main">
      <header id="app-topbar"></header>

      <div class="page-content">
        <!-- Page Title & Header -->
        <div class="page-header">
          <div class="page-title-group">
            <h1><i class="fa-solid fa-users" style="color: var(--primary);"></i> Insurance Agent Directory</h1>
            <p class="page-subtitle">Manage, search, and monitor all licensed and in-training insurance agents.</p>
          </div>
          <div class="page-actions">
            <a href="register-agent.html" class="btn btn-primary">
              <i class="fa-solid fa-user-plus"></i> Onboard New Agent
            </a>
          </div>
        </div>

        <!-- Filter & Search Toolbar Card -->
        <div class="card" style="margin-bottom: 24px; padding: 18px 20px;">
          <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1.2fr; gap: 14px; align-items: center;" class="filter-bar-grid">
            <div style="position: relative;">
              <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light);"></i>
              <input type="text" id="agent-search" class="form-control" style="padding-left: 38px;" placeholder="Search name, ID, license, phone...">
            </div>

            <div>
              <select id="filter-status" class="form-control">
                <option value="">All Statuses</option>
                <option value="Active">Active</option>
                <option value="Top Performer">Top Performer</option>
                <option value="In Training">In Training</option>
                <option value="On Leave">On Leave</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>

            <div>
              <select id="filter-level" class="form-control">
                <option value="">All Levels</option>
                <option value="Platinum">Platinum (>=150%)</option>
                <option value="Gold">Gold (120-149%)</option>
                <option value="Silver">Silver (100-119%)</option>
                <option value="Bronze">Bronze (70-99%)</option>
                <option value="Rising Star">Rising Star</option>
              </select>
            </div>

            <div>
              <select id="filter-location" class="form-control">
                <option value="">All Locations</option>
              </select>
            </div>

            <div>
              <select id="sort-by" class="form-control">
                <option value="name-asc">Sort: Name (A-Z)</option>
                <option value="name-desc">Sort: Name (Z-A)</option>
                <option value="premium-desc">Sort: Highest Premium</option>
                <option value="commission-desc">Sort: Highest Commission</option>
                <option value="join-newest">Sort: Newest Joined</option>
                <option value="join-oldest">Sort: Oldest Joined</option>
              </select>
            </div>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border);">
            <div id="results-count" style="font-size: 13.5px; font-weight: 600; color: var(--text-muted);">
              Showing all agents
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="font-size: 12px; color: var(--text-light); text-transform: uppercase; font-weight: 700;">View Mode:</span>
              <button class="btn btn-sm btn-amber-light active" id="btn-grid-view">
                <i class="fa-solid fa-grip"></i> Grid
              </button>
              <button class="btn btn-sm btn-outline" id="btn-table-view">
                <i class="fa-solid fa-list"></i> Table
              </button>
            </div>
          </div>
        </div>

        <!-- Grid View Container -->
        <div id="agents-grid-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 28px;">
          <!-- Loaded by agents.js -->
        </div>

        <!-- Table View Container -->
        <div id="agents-table-container" class="card" style="display: none; margin-bottom: 28px; padding: 0;">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Agent</th>
                  <th>Location & Contact</th>
                  <th>Specialization</th>
                  <th>Status</th>
                  <th>Performance Level</th>
                  <th>Premium Volume</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="agents-table-tbody">
                <!-- Loaded by agents.js -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- Pagination Controls -->
        <div id="pagination-container" style="display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 20px;">
          <!-- Loaded by agents.js -->
        </div>
      </div>
    </main>
  </div>

  <!-- Edit Agent Modal -->
  <div class="modal-overlay" id="edit-agent-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title"><i class="fa-solid fa-user-pen" style="color: var(--primary);"></i> Edit Agent Profile</h3>
        <button class="modal-close-btn" onclick="closeModal('edit-agent-modal')">&times;</button>
      </div>
      <form id="edit-agent-form">
        <input type="hidden" id="edit-agent-id">
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="edit-name">Full Name <span class="required">*</span></label>
              <input type="text" id="edit-name" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="edit-email">Email Address <span class="required">*</span></label>
              <input type="email" id="edit-email" class="form-control" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="edit-phone">Phone Number <span class="required">*</span></label>
              <input type="text" id="edit-phone" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="edit-specialization">Specialization <span class="required">*</span></label>
              <select id="edit-specialization" class="form-control" required>
                <option value="Life">Life</option>
                <option value="Health">Health</option>
                <option value="Motor">Motor</option>
                <option value="Property">Property</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="edit-status">Status <span class="required">*</span></label>
              <select id="edit-status" class="form-control" required>
                <option value="Active">Active</option>
                <option value="Top Performer">Top Performer</option>
                <option value="In Training">In Training</option>
                <option value="On Leave">On Leave</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="edit-level">Performance Level <span class="required">*</span></label>
              <select id="edit-level" class="form-control" required>
                <option value="Platinum">Platinum</option>
                <option value="Gold">Gold</option>
                <option value="Silver">Silver</option>
                <option value="Bronze">Bronze</option>
                <option value="Rising Star">Rising Star</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="edit-city">City <span class="required">*</span></label>
              <input type="text" id="edit-city" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="edit-state">State <span class="required">*</span></label>
              <input type="text" id="edit-state" class="form-control" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="edit-license">License Number</label>
              <input type="text" id="edit-license" class="form-control">
            </div>
            <div class="form-group">
              <label class="form-label" for="edit-license-expiry">License Expiry Date</label>
              <input type="date" id="edit-license-expiry" class="form-control">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal('edit-agent-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/agents.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      AgentApp.init('agents');
      initAgentsPage();
    });
  </script>
</body>
</html>
