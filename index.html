<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentPro - Insurance Agent Management System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark.css">
  <style>
    .splash-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .splash-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 12px 25px -4px rgba(245, 158, 11, 0.5);
      margin-bottom: 20px;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .splash-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      font-family: 'Outfit', sans-serif;
    }
    .splash-title span { color: #f59e0b; }
    .splash-subtitle {
      color: #94a3b8;
      font-size: 14px;
      max-width: 400px;
      margin-bottom: 24px;
    }
    .splash-loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(245, 158, 11, 0.2);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="splash-logo">
      <i class="fa-solid fa-shield-halved"></i>
    </div>
    <div class="splash-title">Agent<span>Pro</span></div>
    <div class="splash-subtitle">Insurance Agent Lifecycle & Commission Management Platform</div>
    <div class="splash-loader"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        if (AgentAuth.isAuthenticated()) {
          window.location.href = 'dashboard.html';
        } else {
          window.location.href = 'login.html';
        }
      }, 300);
    });
  </script>
</body>
</html>
